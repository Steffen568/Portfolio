<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" fill="none" stroke="currentColor" color="currentColor" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C9A227" stroke="none"/>
    </marker>
  </defs>

  <!-- Front door: six pages, each with a Spanish twin -->
  <rect x="16" y="16" width="374" height="256" rx="6" stroke-width="2"/>
  <text x="30" y="46" fill="currentColor" stroke="none" font-size="16" font-weight="700">Front door (new site)</text>
  <g stroke-width="1.5">
    <rect x="30" y="62" width="168" height="58" rx="4"/>
    <rect x="208" y="62" width="168" height="58" rx="4"/>
    <rect x="30" y="130" width="168" height="58" rx="4"/>
    <rect x="208" y="130" width="168" height="58" rx="4"/>
    <rect x="30" y="198" width="168" height="58" rx="4"/>
    <rect x="208" y="198" width="168" height="58" rx="4"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="15">
    <text x="42" y="96">Home</text>
    <text x="220" y="96">Your real cost</text>
    <text x="42" y="164">Admissions</text>
    <text x="220" y="164">Outcomes</text>
    <text x="42" y="232">Contact</text>
    <text x="220" y="232">Español</text>
  </g>
  <g stroke="#C9A227" stroke-width="1.5">
    <rect x="158" y="80" width="30" height="22" rx="3"/>
    <rect x="336" y="80" width="30" height="22" rx="3"/>
    <rect x="158" y="148" width="30" height="22" rx="3"/>
    <rect x="336" y="148" width="30" height="22" rx="3"/>
    <rect x="158" y="216" width="30" height="22" rx="3"/>
    <rect x="336" y="216" width="30" height="22" rx="3"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="14" font-weight="700" text-anchor="middle">
    <text x="173" y="96">ES</text>
    <text x="351" y="96">ES</text>
    <text x="173" y="164">ES</text>
    <text x="351" y="164">ES</text>
    <text x="173" y="232">ES</text>
    <text x="351" y="232">ES</text>
  </g>

  <!-- Arrows: the front door links out to what the school already has -->
  <g stroke="#C9A227" stroke-width="2" marker-end="url(#head)">
    <line x1="392" y1="91" x2="534" y2="91"/>
    <line x1="392" y1="159" x2="534" y2="159"/>
    <line x1="392" y1="227" x2="534" y2="227"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="14" text-anchor="middle">
    <text x="462" y="120">links out,</text>
    <text x="462" y="138">nothing rebuilt</text>
  </g>

  <!-- The school's existing systems -->
  <rect x="536" y="16" width="248" height="256" rx="6" stroke-width="2"/>
  <text x="550" y="46" fill="currentColor" stroke="none" font-size="16" font-weight="700">School's existing systems</text>
  <g stroke-width="1.5">
    <rect x="550" y="62" width="220" height="58" rx="4"/>
    <rect x="550" y="130" width="220" height="58" rx="4"/>
    <rect x="550" y="198" width="220" height="58" rx="4"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="15">
    <text x="564" y="96">Payments</text>
    <text x="564" y="164">Admissions forms</text>
    <text x="564" y="232">Current-family portal</text>
  </g>

  <!-- Phase 2, frozen -->
  <rect x="16" y="290" width="768" height="88" rx="6" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="30" y="320" fill="currentColor" stroke="none" font-size="16" font-weight="700">Phase 2 (frozen)</text>
  <g fill="currentColor" stroke="none" font-size="15">
    <text x="30" y="354">Safety</text>
    <text x="150" y="354">Our Story</text>
    <text x="290" y="354">Academics</text>
    <text x="430" y="354">Student Life</text>
  </g>

  <text x="400" y="414" fill="currentColor" stroke="none" font-size="15" text-anchor="middle">Concept, Phase 1 · pending board approval</text>
</svg>
