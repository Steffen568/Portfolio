<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="sans-serif" fill="currentColor" color="currentColor">
  <title>How SCOUT DFS builds lineups</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d97f00"/>
    </marker>
  </defs>

  <!-- Inputs -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="16" y="20" width="224" height="90" rx="6"/>
    <rect x="16" y="130" width="224" height="90" rx="6"/>
    <rect x="16" y="240" width="224" height="90" rx="6"/>
  </g>
  <text x="128" y="72" font-size="17" text-anchor="middle">Player pool + salaries</text>
  <text x="128" y="182" font-size="17" text-anchor="middle">Projections</text>
  <text x="128" y="278" font-size="17" text-anchor="middle">Your settings</text>
  <text x="128" y="302" font-size="15" text-anchor="middle">(locks, exposure, stacks)</text>

  <!-- Arrows in -->
  <g stroke="#d97f00" stroke-width="3" fill="none" marker-end="url(#head)">
    <line x1="242" y1="65" x2="296" y2="110"/>
    <line x1="242" y1="175" x2="296" y2="175"/>
    <line x1="242" y1="285" x2="296" y2="240"/>
  </g>

  <!-- Solver -->
  <rect x="300" y="20" width="210" height="310" rx="6" fill="none" stroke="#d97f00" stroke-width="3"/>
  <text x="405" y="58" font-size="22" font-weight="700" text-anchor="middle">Solver</text>
  <g font-size="17" text-anchor="middle">
    <text x="405" y="100">Salary cap</text>
    <text x="405" y="138">Roster slots</text>
    <text x="405" y="176">Team limits</text>
    <text x="405" y="214">Stacks</text>
    <text x="405" y="252">Exposure</text>
    <text x="405" y="290">Unique lineups</text>
  </g>

  <!-- Arrow out -->
  <line x1="512" y1="175" x2="552" y2="175" stroke="#d97f00" stroke-width="3" marker-end="url(#head)"/>

  <!-- Right box: three lineup cards, stacked. Back cards draw only what shows. -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="556" y="20" width="228" height="310" rx="6"/>
    <path d="M622 78 V50 H760 V246 H734"/>
    <path d="M600 110 V78 H734 V274 H712"/>
    <rect x="578" y="110" width="134" height="196" rx="4"/>
    <g stroke-width="3">
      <line x1="592" y1="140" x2="698" y2="140"/>
      <line x1="592" y1="170" x2="698" y2="170"/>
      <line x1="592" y1="200" x2="698" y2="200"/>
      <line x1="592" y1="230" x2="698" y2="230"/>
      <line x1="592" y1="260" x2="698" y2="260"/>
    </g>
  </g>

  <text x="400" y="386" font-size="22" text-anchor="middle">Press Build. Every lineup is valid under every rule.</text>
</svg>
