<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t">
  <title id="t">SlateHub data flow: seven API and scraper sources feed a three-agent pipeline into Neon, which feeds the Game View</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5" font-family="system-ui, sans-serif">
    <!-- Sources -->
    <text x="110" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">APIs + scrapers</text>
    <rect x="20" y="52" width="180" height="34" rx="5"/>
    <text x="110" y="74" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">MLB Stats API</text>
    <rect x="20" y="94" width="180" height="34" rx="5"/>
    <text x="110" y="116" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">Baseball Savant</text>
    <rect x="20" y="136" width="180" height="34" rx="5"/>
    <text x="110" y="158" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">FanGraphs</text>
    <rect x="20" y="178" width="180" height="34" rx="5"/>
    <text x="110" y="200" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">DraftKings</text>
    <rect x="20" y="220" width="180" height="34" rx="5"/>
    <text x="110" y="242" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">ESPN</text>
    <rect x="20" y="262" width="180" height="34" rx="5"/>
    <text x="110" y="284" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">PropFinder</text>
    <rect x="20" y="304" width="180" height="34" rx="5"/>
    <text x="110" y="326" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">RotoGrinders</text>
    <path d="M206 69 L216 69 L216 321 L206 321"/>
    <path d="M216 130 L252 130" marker-end="url(#arrow)"/>
    <path d="M216 215 L252 215" marker-end="url(#arrow)"/>

    <!-- Pipeline -->
    <rect x="258" y="108" width="190" height="44" rx="6"/>
    <text x="353" y="136" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">Agent 1: stats</text>
    <rect x="258" y="193" width="190" height="44" rx="6"/>
    <text x="353" y="221" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">Agent 2: lineups</text>
    <path d="M353 237 L353 271" marker-end="url(#arrow)"/>
    <rect x="258" y="277" width="190" height="44" rx="6"/>
    <text x="353" y="305" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">Agent 3: projections</text>

    <!-- Database -->
    <path d="M448 130 L486 180" marker-end="url(#arrow)"/>
    <path d="M448 215 L486 215" marker-end="url(#arrow)"/>
    <path d="M448 299 L486 250" marker-end="url(#arrow)"/>
    <rect x="492" y="160" width="130" height="110" rx="10" stroke="#f97316" stroke-width="2.5"/>
    <text x="557" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" stroke="none">Neon</text>
    <text x="557" y="228" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">20 tables</text>
    <text x="557" y="248" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">joined by ID</text>

    <!-- Page -->
    <path d="M622 215 L652 215" marker-end="url(#arrow)"/>
    <rect x="658" y="120" width="126" height="190" rx="8"/>
    <text x="721" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">Game View</text>
    <text x="721" y="190" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">park</text>
    <text x="721" y="220" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">weather</text>
    <text x="721" y="250" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">pitchers</text>
    <text x="721" y="280" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">hitters</text>
  </g>
</svg>
