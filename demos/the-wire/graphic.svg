<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Verdana, Segoe UI, sans-serif" fill="currentColor">
  <title>The Wire: SIS data and a DraftKings slate go in, three steps run, and a report comes out</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Inputs -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="10" y="70" width="150" height="90" rx="6"/>
    <rect x="10" y="230" width="150" height="90" rx="6"/>
  </g>
  <text x="85" y="122" font-size="18" text-anchor="middle">SIS data</text>
  <text x="85" y="268" font-size="18" text-anchor="middle">DraftKings</text>
  <text x="85" y="292" font-size="18" text-anchor="middle">slate</text>

  <!-- Input arrows -->
  <g stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M160 115 L208 170"/>
    <path d="M160 275 L208 220"/>
  </g>

  <!-- The Wire -->
  <rect x="210" y="10" width="340" height="370" rx="6" fill="none" stroke="#d98e04" stroke-width="3"/>
  <text x="380" y="42" font-size="20" font-weight="700" text-anchor="middle" fill="#d98e04">The Wire</text>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="228" y="58" width="304" height="74" rx="4"/>
    <rect x="228" y="146" width="304" height="124" rx="4"/>
    <rect x="228" y="284" width="304" height="78" rx="4"/>
  </g>
  <text x="380" y="88" font-size="17" text-anchor="middle">Join and filter</text>
  <text x="380" y="112" font-size="17" text-anchor="middle">to the slate</text>
  <text x="380" y="174" font-size="17" text-anchor="middle">Mark every figure:</text>
  <text x="380" y="200" font-size="15" text-anchor="middle">tendency / volume /</text>
  <text x="380" y="224" font-size="15" text-anchor="middle">adjusted quality /</text>
  <text x="380" y="248" font-size="15" text-anchor="middle">raw quality</text>
  <text x="380" y="330" font-size="17" text-anchor="middle">Sweep for matchup gaps</text>

  <!-- Output arrow -->
  <path d="M550 195 L606 195" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Report -->
  <rect x="608" y="70" width="182" height="250" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="699" y="104" font-size="20" font-weight="700" text-anchor="middle">Report</text>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="624" y="124" width="150" height="76" rx="4"/>
    <rect x="624" y="218" width="150" height="76" rx="4"/>
  </g>
  <text x="699" y="168" font-size="17" text-anchor="middle">Gap worksheet</text>
  <text x="699" y="262" font-size="17" text-anchor="middle">Fact lines</text>

  <!-- Below the report -->
  <text x="790" y="412" font-size="17" text-anchor="end">feeds player pool and</text>
  <text x="790" y="438" font-size="17" text-anchor="end">exposure decisions</text>
  <path d="M699 320 L699 390" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
